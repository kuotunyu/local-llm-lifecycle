# 訓練超參數單一事實來源（PLAN.md §4.6）
# notebooks/colab_qlora_train.ipynb 的 config cell 會讀這份檔案；
# 若 Colab 執行環境找不到這個檔案（例如尚未上傳），notebook 內建有完全相同數值的備援設定。
#
# mode 切換 Phase 2（sanity_check）與 Phase 3（full_run）共用同一份檔案：
#   Phase 2：mode: sanity_check
#   Phase 3：把 mode 改成 full_run 即可，其餘欄位不動（除非要調整超參數）

mode: full_run  # sanity_check | full_run

model:
  base_model: "unsloth/Qwen3-8B-unsloth-bnb-4bit"  # Unsloth 官方預量化鏡像，Colab 下載快
  chat_template: "qwen3"  # 注意：不是 "qwen3-instruct"（那是給 Instruct-2507 系列用的），
                           # Qwen3-8B 只有 hybrid thinking 版本，"qwen3" template 才是正確搭配
  max_length: 2048        # TRL SFTConfig 現行欄位名（max_seq_length 已於 TRL v0.16.0 移除）

lora:
  r: 16
  alpha: 16
  dropout: 0
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  use_gradient_checkpointing: "unsloth"
  random_state: 3407
  # 註：Unsloth 官方 Qwen3 範例 notebook 預設用 r=32/alpha=32（容量更大）；
  # 這裡沿用 PLAN.md 草案的 r=16（抽取式 QA 輸出格式單純，不需要太大容量），
  # 若之後發現欠擬合可以調大。

sanity_check:
  max_train_samples: 200
  eval_holdout: 20        # 從 200 筆中額外切出，只做 eval loss 監控，不參與訓練梯度更新
  num_train_epochs: 3
  save_steps: 5           # 存密一點，方便 kill-resume 演練在幾分鐘內就能驗證
  eval_steps: 5
  logging_steps: 1

full_run:
  max_train_samples: null  # null = 用 train_sft.jsonl 全部 10000 筆
  eval_holdout: 200
  num_train_epochs: 2
  save_steps: 50           # 8B QLoRA 在 L4 上一次 save_steps 間隔預估落在 15-30 分鐘（PLAN.md §2.4）
  eval_steps: 50
  logging_steps: 10

training:
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8   # 有效 batch = 16
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  optim: "adamw_8bit"
  bf16: true
  weight_decay: 0.001
  save_total_limit: 2
  packing: false  # Unsloth 官方 Qwen3 notebook 預設不開；與 train_on_responses_only 的
                  # response-only loss masking 搭配尚未驗證，先保守關閉
  seed: 3407

hub:
  dataset_repo: "steven0226/drcd-zhtw-extractive-qa-sft"       # Phase 1 已推送（private）
  adapter_checkpoint_repo_sanity: "steven0226/qwen3-8b-drcd-qa-ckpt-sanity"
  adapter_checkpoint_repo_full: "steven0226/qwen3-8b-drcd-qa-ckpt"

wandb:
  project: "qwen3-drcd-qlora"

drive:
  backup_dir: "/content/drive/MyDrive/qwen3-drcd-qlora-backup"
  # notebook 實際使用時會在這個路徑下再加一層 mode 子目錄（sanity_check/ 或 full_run/），
  # 避免兩種模式的 checkpoint 互相干擾（Phase 2 對抗性覆核抓到的真實問題）
